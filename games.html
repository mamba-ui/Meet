<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Meet — Games</title>
  <link rel="stylesheet" href="meet.css">
</head>
<body>
  <div class="shell">
    <nav class="pane rail" id="nav"></nav>

    <main class="stage">
      <h1>Games</h1>

      <div class="pane card">
        <h2>Tic-Tac-Toe</h2>
        <div class="ttb" id="board"></div>
        <div class="row">
          <span id="status">Your turn (X)</span>
          <button class="ghost" id="reset">New game</button>
        </div>
      </div>

      <div class="pane card">
        <h2>Guess the number</h2>
        <div class="row">
          <input id="guess" type="number" min="1" max="100" placeholder="1–100">
          <button class="btn" id="check">Guess</button>
        </div>
        <p id="result" class="muted">Make your first guess.</p>
      </div>
    </main>
  </div>

  <script src="meet.js"></script>
  <script>
    requireLogin();
    $("nav").innerHTML = renderNav("games.html");

    let board, over;
    const wins = [[0,1,2],[3,4,5],[6,7,8],[0,3,6],[1,4,7],[2,5,8],[0,4,8],[2,4,6]];

    const winner = (b, player) =>
      wins.some(line => line.every(i => b[i] === player));

    function draw(){
      $("board").innerHTML = board.map((value, i) =>
        `<button class="cell" data-i="${i}">${value}</button>`
      ).join("");
    }

    function reset(){
      board = Array(9).fill("");
      over = false;
      $("status").textContent = "Your turn (X)";
      draw();
    }

    function cpuMove(){
      const empty = board.map((v,i) => v ? null : i).filter(v => v !== null);
      const move = empty[Math.floor(Math.random() * empty.length)];
      board[move] = "O";
    }

    $("board").onclick = e => {
      const cell = e.target.closest(".cell");
      if(!cell || over) return;

      const i = +cell.dataset.i;
      if(board[i]) return;

      board[i] = "X";

      if(winner(board, "X")){
        over = true;
        $("status").textContent = "You win!";
        draw();
        return;
      }

      if(board.every(Boolean)){
        over = true;
        $("status").textContent = "Draw.";
        draw();
        return;
      }

      cpuMove();

      if(winner(board, "O")){
        over = true;
        $("status").textContent = "Computer wins.";
      }else if(board.every(Boolean)){
        over = true;
        $("status").textContent = "Draw.";
      }else{
        $("status").textContent = "Your turn (X)";
      }

      draw();
    };

    $("reset").onclick = reset;

    let secret = Math.ceil(Math.random() * 100);
    let tries = 0;

    $("check").onclick = () => {
      const value = +$("guess").value;

      if(value < 1 || value > 100){
        $("result").textContent = "Enter a number from 1 to 100.";
        return;
      }

      tries++;

      if(value === secret){
        $("result").textContent = `Correct! You got it in ${tries} tries.`;
      }else{
        $("result").textContent = value < secret ? "Too low." : "Too high.";
      }
    };

    reset();
  </script>
</body>
</html>
