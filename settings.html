<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Meet — Settings</title>
  <link rel="stylesheet" href="meet.css">
</head>
<body>
  <div class="shell">
    <nav class="pane rail" id="nav"></nav>

    <main class="stage">
      <h1>Settings</h1>

      <div class="pane card">
        <h2>Display name</h2>
        <div class="row">
          <input id="name" placeholder="Your name">
          <button class="btn" id="save">Save</button>
        </div>
        <p id="saved" class="muted"></p>
      </div>

      <div class="pane card">
        <h2>Account</h2>
        <p class="muted" id="current"></p>
        <button class="danger" id="logout">Log out</button>
      </div>
    </main>
  </div>

  <script src="meet.js"></script>
  <script>
    requireLogin();
    $("nav").innerHTML = renderNav("settings.html");

    $("name").value = getUser();
    $("current").textContent = "Logged in as " + getUser();

    $("save").onclick = () => {
      const name = $("name").value.trim();
      if(!name){
        $("saved").textContent = "Enter a name first.";
        return;
      }

      ls("meetUser", name);
      $("current").textContent = "Logged in as " + name;
      $("saved").textContent = "Name saved.";
    };

    $("logout").onclick = logout;
  </script>
</body>
</html>
