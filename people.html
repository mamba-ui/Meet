<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Meet — People</title>
  <link rel="stylesheet" href="meet.css">
</head>
<body>
  <div class="shell">
    <nav class="pane rail" id="nav"></nav>

    <main class="stage">
      <h1>People</h1>

      <input id="search" placeholder="Search people" style="margin-bottom:14px">
      <div class="pane card" id="peopleList"></div>
    </main>
  </div>

  <script src="meet.js"></script>
  <script>
    requireLogin();
    $("nav").innerHTML = renderNav("people.html");

    function renderPeople(){
      const query = $("search").value.toLowerCase();

      $("peopleList").innerHTML = people
        .filter(p => p.name.toLowerCase().includes(query))
        .map(p => `
          <div class="item">
            <div class="av" style="background:${p.color}">${escapeHTML(initials(p.name))}</div>
            <div class="meta">
              <b>${escapeHTML(p.name)}</b>
              <span>${p.live ? "Online now" : "Offline"}</span>
            </div>
            <a class="btn" href="chat.html">Message</a>
          </div>
        `).join("") || `<p class="muted">No people found.</p>`;
    }

    $("search").oninput = renderPeople;
    renderPeople();
  </script>
</body>
</html>
