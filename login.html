<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Meet</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@400;600;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <!-- Members-only area: filled in by script.js only after a successful login -->
  <div id="app" hidden></div>

  <!-- Login / sign up -->
  <main class="shell" id="gate">
    <aside class="brand">
      <div class="logo">Meet</div>
      <h2>Talk face to face, from anywhere.</h2>
      <p>Sign in to start or join a meeting.</p>
      <div class="tiles" aria-hidden="true">
        <span class="tile t1"><i>A</i></span>
        <span class="tile t2"><i>J</i></span>
        <span class="tile t3"><i>M</i></span>
        <span class="tile t4"><i>S</i></span>
      </div>
    </aside>

    <section class="auth">
      <div class="track" id="track">

        <form class="panel" id="loginForm" novalidate>
          <h1>Log in</h1>
          <p class="sub">Only registered members can enter.</p>

          <label for="loginEmail">Email</label>
          <input type="email" id="loginEmail" autocomplete="email" required>

          <label for="loginPassword">Password</label>
          <div class="pw">
            <input type="password" id="loginPassword" autocomplete="current-password" required>
            <button type="button" class="eye" data-toggle="loginPassword" aria-label="Show password">Show</button>
          </div>

          <p class="msg" id="loginMsg" role="alert" aria-live="polite"></p>
          <button type="submit" class="btn">Log in</button>

          <p class="switch">New here?
            <button type="button" class="link" data-show="signup">Create an account</button>
          </p>
        </form>

        <form class="panel" id="signupForm" novalidate inert>
          <h1>Create account</h1>
          <p class="sub">Sign up once, then log in anytime.</p>

          <label for="signupName">Name</label>
          <input type="text" id="signupName" autocomplete="name" required>

          <label for="signupEmail">Email</label>
          <input type="email" id="signupEmail" autocomplete="email" required>

          <label for="signupPassword">Password <small>(8+ characters)</small></label>
          <div class="pw">
            <input type="password" id="signupPassword" autocomplete="new-password" required>
            <button type="button" class="eye" data-toggle="signupPassword" aria-label="Show password">Show</button>
          </div>

          <label for="signupConfirm">Confirm password</label>
          <input type="password" id="signupConfirm" autocomplete="new-password" required>

          <p class="msg" id="signupMsg" role="alert" aria-live="polite"></p>
          <button type="submit" class="btn">Create account</button>

          <p class="switch">Already a member?
            <button type="button" class="link" data-show="login">Log in</button>
          </p>
        </form>

      </div>
    </section>
  </main>

  <script src="script.js"></script>
</body>
</html>
