<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Meet — Account</title>
  <link rel="stylesheet" href="meet.css">
</head>
<body>
  <div class="shell">
    <nav class="pane rail" id="nav"></nav>

    <main class="stage">
      <h1 id="profileName"></h1>

      <div class="pane card">
        <div class="row">
          <div class="av" id="avatar"></div>
          <div class="meta">
            <b id="followers">0 followers</b>
            <span id="following">0 following</span>
          </div>
          <a class="ghost" href="settings.html">Edit name</a>
        </div>
      </div>

      <div class="pane card" id="peopleList"></div>
    </main>
  </div>

  <script src="meet.js"></script>
  <script>
    requireLogin();
    $("nav").innerHTML = renderNav("account.html");

    const user = getUser();
    const following = JSON.parse(ls("meetFollowing") || '["Amara N.","Eric M."]');

    $("profileName").textContent = user;
    $("avatar").textContent = initials(user);
    $("followers").textContent = "5 followers";
    $("following").textContent = following.length + " following";

    const suggestions = [
      ["Grace U.", "#feda75"],
      ["Jean Paul", "#ffb199"],
      ["Aline K.", "#ffc6e0"],
      ["Patrick S.", "#a8f0d8"]
    ];

    $("peopleList").innerHTML = suggestions.map(([name, color]) => {
      const isFollowing = following.includes(name);
      return `
        <div class="item">
          <div class="av" style="background:${color}">${escapeHTML(initials(name))}</div>
          <div class="meta"><b>${escapeHTML(name)}</b><span>Suggested for you</span></div>
          <button class="${isFollowing ? "ghost" : "btn"}" data-name="${escapeHTML(name)}">
            ${isFollowing ? "Following" : "Follow"}
          </button>
        </div>
      `;
    }).join("");

    $("peopleList").onclick = e => {
      const button = e.target.closest("button[data-name]");
      if(!button) return;

      const name = button.dataset.name;
      const index = following.indexOf(name);

      if(index === -1) following.push(name);
      else following.splice(index, 1);

      ls("meetFollowing", JSON.stringify(following));
      location.reload();
    };
  </script>
</body>
</html>
