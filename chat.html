<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Meet — Chat</title>
  <link rel="stylesheet" href="meet.css">
</head>
<body>
  <div class="shell">
    <nav class="pane rail" id="nav"></nav>

    <main class="stage">
      <h1>Chat</h1>

      <div class="pane card">
        <label class="muted" for="person">Choose conversation</label>
        <select id="person" style="margin:10px 0;width:100%"></select>

        <div class="msgs" id="msgs"></div>

        <form id="form" class="row" style="margin-top:12px">
          <input id="input" placeholder="Write a message" autocomplete="off">
          <button class="btn">Send</button>
        </form>
      </div>
    </main>
  </div>

  <script src="meet.js"></script>
  <script>
    requireLogin();
    loadPeople();
    $("nav").innerHTML = renderNav("chat.html");

    let current = people[0];

    function fillPeople(){
      $("person").innerHTML = people.map(p =>
        `<option value="${p.id}">${escapeHTML(p.name)}</option>`
      ).join("");
      $("person").value = current.id;
    }

    function renderChat(){
      $("msgs").innerHTML = current.msgs.map(m =>
        `<div class="m ${m[0] === "me" ? "me" : ""}">
          ${escapeHTML(m[1])}
          <time>${escapeHTML(m[2])}</time>
        </div>`
      ).join("");
      $("msgs").scrollTop = $("msgs").scrollHeight;
    }

    $("person").onchange = e => {
      current = personById(e.target.value);
      renderChat();
    };

    $("form").onsubmit = e => {
      e.preventDefault();
      const text = $("input").value.trim();
      if(!text) return;

      current.msgs.push(["me", text, nowTime()]);
      $("input").value = "";
      savePeople();
      renderChat();

      if(!current.live) return;

      setTimeout(() => {
        const replies = ["Sounds good!", "Got it.", "Let's do it.", "Talk soon."];
        current.msgs.push(["them",
          replies[Math.floor(Math.random() * replies.length)],
          nowTime()
        ]);
        savePeople();
        renderChat();
      }, 1200);
    };

    fillPeople();
    renderChat();
  </script>
</body>
</html>
