<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Meet — Home</title>
  <link rel="stylesheet" href="meet.css">
</head>
<body>
  <div class="shell">
    <nav class="pane rail" id="nav"></nav>

    <main class="stage">
      <h1 id="welcome">Welcome</h1>
      <p class="muted">Where would you like to go?</p>

      <div class="grid" style="margin-top:20px">
        <a class="pane tile" href="meet.html"><h2>📹 Meet</h2><span class="muted">Start or join a meeting.</span></a>
        <a class="pane tile" href="chat.html"><h2>💬 Chat</h2><span class="muted">Message your people.</span></a>
        <a class="pane tile" href="calls.html"><h2>📞 Calls</h2><span class="muted">See recent calls.</span></a>
        <a class="pane tile" href="people.html"><h2>👥 People</h2><span class="muted">Find contacts.</span></a>
        <a class="pane tile" href="games.html"><h2>🎮 Games</h2><span class="muted">Play quick games.</span></a>
        <a class="pane tile" href="account.html"><h2>👤 Account</h2><span class="muted">Followers and following.</span></a>
        <a class="pane tile" href="settings.html"><h2>⚙️ Settings</h2><span class="muted">Name and theme.</span></a>
      </div>
    </main>
  </div>

  <script src="meet.js"></script>
  <script>
    requireLogin();
    $("nav").innerHTML = renderNav("home.html");
    $("welcome").textContent = "Welcome, " + getUser();
  </script>
</body>
</html>
