<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Meet – Home</title>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
:root{--text:#eaf6ff;--muted:#a3bdd1;--ice:#9fe8ff;--ice2:#b9a8ff;--glass:rgba(200,235,255,.09);--edge:rgba(220,245,255,.28);--ink:#06202e;box-sizing:border-box;color-scheme:dark}
*,*::before,*::after{box-sizing:inherit}
body{margin:0;min-height:100vh;color:var(--text);font:15px/1.45 "Outfit",system-ui,sans-serif;background:radial-gradient(900px 600px at 15% 10%,#1d4f78 0,transparent 60%),radial-gradient(800px 600px at 90% 90%,#47348f 0,transparent 60%),#07121f}
.wrap{max-width:900px;margin:0 auto;padding:22px 18px 40px}
nav{display:flex;align-items:center;justify-content:space-between;margin-bottom:50px}
nav b{font-weight:600;font-size:22px}
nav button{background:var(--glass);border:1px solid var(--edge);color:var(--text);border-radius:12px;padding:8px 14px;font:inherit;cursor:pointer}
h1{font-weight:500;font-size:clamp(30px,6vw,46px);margin:0 0 8px}
.sub{color:var(--muted);margin:0 0 34px;font-size:17px}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:18px}
a.tile{display:block;min-height:190px;padding:26px;border-radius:26px;text-decoration:none;color:inherit;background:var(--glass);border:1px solid var(--edge);-webkit-backdrop-filter:blur(22px);backdrop-filter:blur(22px);transition:transform .2s,border-color .2s}
a.tile:hover{transform:translateY(-4px);border-color:var(--ice)}
.tag{display:inline-block;font-size:12px;padding:3px 11px;border-radius:99px;margin-bottom:16px}
.t1{background:#1f2330;border:1px solid #3a4057}
.t2{background:linear-gradient(135deg,var(--ice),var(--ice2));color:var(--ink);font-weight:600}
a.tile h2{margin:0 0 8px;font-weight:500;font-size:24px}
a.tile p{margin:0;color:var(--muted)}
:focus-visible{outline:2px solid var(--ice);outline-offset:2px}
</style>
</head>
<body>
<div class="wrap">
  <nav><b>Meet</b><button id="out">Log out</button></nav>
  <h1 id="hi">Welcome</h1>
  <p class="sub">Where would you like to go?</p>
  <div class="grid">
    <a class="tile" href="chat.html?theme=dark">
      <span class="tag t1">Dark theme</span>
      <h2>Meet Chat</h2>
      <p>Clean dark messaging with your conversations and a video call button.</p>
    </a>
    <a class="tile" href="chat.html?theme=plus">
      <span class="tag t2">Frosted glass</span>
      <h2>Meet Chat Plus</h2>
      <p>Frosted glass messaging with glowing particles in the background.</p>
    </a>
  </div>
</div>
<script>
var u=null;
try{u=localStorage.getItem("meetUser")}catch(e){}
if(!u){location.replace("index.html")}
else{document.getElementById("hi").textContent="Welcome, "+u}
document.getElementById("out").addEventListener("click",function(){
  try{localStorage.removeItem("meetUser")}catch(e){}
  location.href="index.html";
});
</script>
</body>
</html>
