<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Meet — Messages</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{--blue:#3897f0;--purple:#8134af;--pink:#dd2a7b;--orange:#f58529;--yellow:#feda77;--bg:#08080d;--panel:rgba(18,18,24,.72);--panel-2:rgba(255,255,255,.04);--border:rgba(255,255,255,.10);--text:#f5f5f7;--muted:#a8a8b3}
body{font-family:"Inter",system-ui,sans-serif;background:radial-gradient(900px 600px at 10% 10%,rgba(221,42,123,.22),transparent 60%),radial-gradient(800px 600px at 90% 15%,rgba(129,52,175,.25),transparent 60%),radial-gradient(900px 700px at 50% 100%,rgba(56,151,240,.20),transparent 65%),var(--bg);background-attachment:fixed;color:var(--text);min-height:100vh;overflow-x:hidden}
canvas{position:fixed;inset:0;z-index:0;pointer-events:none}
.app{position:relative;z-index:1;max-width:1250px;margin:0 auto;padding:20px 20px 90px}
header{display:flex;align-items:center;justify-content:space-between;gap:16px;padding:14px 18px;border:1px solid var(--border);border-radius:20px;background:var(--panel);backdrop-filter:blur(20px);margin-bottom:22px}
.logo{font-size:26px;font-weight:800;letter-spacing:-.04em;background:linear-gradient(90deg,var(--yellow),var(--orange),var(--pink),var(--purple),var(--blue));-webkit-background-clip:text;background-clip:text;color:transparent}
.search{flex:1;max-width:460px}
.search input,.lsearch{width:100%;height:44px;border-radius:14px;border:1px solid var(--border);background:var(--panel-2);color:var(--text);padding:0 16px;outline:none;font:14px Inter,sans-serif}
.search input:focus,.lsearch:focus,.composer input:focus{border-color:rgba(56,151,240,.7);box-shadow:0 0 0 4px rgba(56,151,240,.14)}
.header-actions{display:flex;align-items:center;gap:10px}
.icon-btn{width:42px;height:42px;display:grid;place-items:center;border-radius:13px;border:1px solid var(--border);background:var(--panel-2);color:var(--text);cursor:pointer;font-size:17px;text-decoration:none;transition:.2s}
.icon-btn:hover{background:rgba(255,255,255,.09);transform:translateY(-1px)}
.avatar{width:42px;height:42px;border-radius:50%;background:linear-gradient(135deg,var(--pink),var(--purple),var(--blue));display:grid;place-items:center;font-weight:700;box-shadow:0 0 20px rgba(221,42,123,.35)}
.layout{display:grid;grid-template-columns:250px 320px 1fr;gap:20px;align-items:start}
.panel{background:var(--panel);border:1px solid var(--border);border-radius:20px;padding:18px;backdrop-filter:blur(20px)}
.nav{display:grid;gap:8px;position:sticky;top:20px}
.nav a{display:flex;align-items:center;gap:12px;color:var(--muted);text-decoration:none;padding:12px 14px;border-radius:14px;font-weight:600;font-size:14px;transition:.2s}
.nav a:hover{color:var(--text);background:var(--panel-2)}
.nav a.active{color:#fff;background:linear-gradient(90deg,rgba(56,151,240,.25),rgba(221,42,123,.25));border:1px solid rgba(255,255,255,.12)}
.section-title{display:flex;align-items:center;justify-content:space-between;margin-bottom:14px}
.section-title h2{font-size:18px}
.lsearch{margin-bottom:12px;height:40px}
.list{height:calc(100vh - 140px);min-height:520px;overflow-y:auto}
.conv{display:flex;gap:12px;align-items:center;padding:12px;border-radius:16px;cursor:pointer;transition:.2s;border:1px solid transparent;margin-bottom:6px}
.conv:hover{background:var(--panel-2);border-color:var(--border)}
.conv.on{background:linear-gradient(90deg,rgba(56,151,240,.18),rgba(221,42,123,.18));border-color:rgba(255,255,255,.14)}
.pa{width:44px;height:44px;border-radius:50%;display:grid;place-items:center;font-weight:700;flex-shrink:0;position:relative}
.a{background:linear-gradient(135deg,#3897f0,#8134af)}.b{background:linear-gradient(135deg,#dd2a7b,#f58529)}.c{background:linear-gradient(135deg,#feda77,#dd2a7b)}.d{background:linear-gradient(135deg,#8134af,#3897f0)}
.dot{position:absolute;right:-1px;bottom:-1px;width:12px;height:12px;border-radius:50%;background:#34d27b;border:2px solid #14141c}
.dot.off{background:#6b6b78}
.ci{flex:1;min-width:0}.ci strong{display:flex;justify-content:space-between;font-size:14px}.ci strong em{font:500 11px Inter;color:var(--muted)}
.ci p{font-size:12px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.badge{background:linear-gradient(90deg,var(--pink),var(--purple));font-size:11px;font-weight:700;min-width:22px;height:22px;display:grid;place-items:center;border-radius:999px;padding:0 6px}
/* glass chat */
.chat{display:flex;flex-direction:column;height:calc(100vh - 140px);min-height:520px;padding:0;overflow:hidden;background:rgba(18,18,24,.38);backdrop-filter:blur(26px) saturate(140%);box-shadow:0 0 60px rgba(129,52,175,.15),inset 0 0 0 1px rgba(255,255,255,.04)}
.chead{display:flex;align-items:center;gap:12px;padding:14px 18px;border-bottom:1px solid var(--border);background:rgba(255,255,255,.03)}
.chead .ci p{color:#34d27b}.chead .ci p.off{color:var(--muted)}
.back{display:none}
.msgs{flex:1;overflow-y:auto;padding:20px;display:flex;flex-direction:column;gap:10px}
.day{align-self:center;font-size:12px;color:var(--muted);background:rgba(255,255,255,.05);border:1px solid var(--border);padding:4px 12px;border-radius:999px;margin-bottom:4px}
.m{max-width:72%;padding:11px 15px 8px;border-radius:20px;font-size:14px;line-height:1.45;backdrop-filter:blur(14px);animation:pop .25s ease-out;overflow-wrap:anywhere}
.m time{display:block;font-size:10px;color:rgba(255,255,255,.5);margin-top:3px;text-align:right}
.m.in{align-self:flex-start;background:rgba(255,255,255,.07);border:1px solid rgba(255,255,255,.14);border-bottom-left-radius:6px}
.m.out{align-self:flex-end;background:linear-gradient(135deg,rgba(56,151,240,.38),rgba(221,42,123,.38));border:1px solid rgba(255,255,255,.22);border-bottom-right-radius:6px;box-shadow:0 0 26px rgba(221,42,123,.2)}
.typing{align-self:flex-start;display:flex;gap:5px;padding:14px 16px;border-radius:20px;border-bottom-left-radius:6px;background:rgba(255,255,255,.07);border:1px solid rgba(255,255,255,.14)}
.typing i{width:7px;height:7px;border-radius:50%;background:var(--muted);animation:bl 1s infinite}
.typing i:nth-child(2){animation-delay:.15s}.typing i:nth-child(3){animation-delay:.3s}
@keyframes bl{0%,60%,100%{opacity:.3;transform:none}30%{opacity:1;transform:translateY(-4px)}}
@keyframes pop{from{opacity:0;transform:translateY(8px) scale(.97)}}
.composer{display:flex;gap:10px;padding:14px 18px;border-top:1px solid var(--border);background:rgba(255,255,255,.03)}
.composer input{flex:1;height:46px;border-radius:14px;border:1px solid var(--border);background:rgba(255,255,255,.05);color:var(--text);padding:0 16px;outline:none;font:14px Inter,sans-serif}
.send{width:46px;height:46px;border:0;border-radius:14px;color:#fff;font-size:18px;cursor:pointer;background:linear-gradient(90deg,var(--blue),var(--purple),var(--pink),var(--orange));background-size:220% 100%;box-shadow:0 10px 26px rgba(221,42,123,.25);transition:.2s}
.send:hover{transform:translateY(-1px);background-position:100% 0}
button:focus-visible,.conv:focus-visible{outline:2px solid var(--blue);outline-offset:2px}
.bottom-nav{position:fixed;bottom:16px;left:50%;transform:translateX(-50%);z-index:5;display:none;gap:6px;padding:8px;border-radius:20px;border:1px solid var(--border);background:rgba(12,12,18,.85);backdrop-filter:blur(20px)}
.bottom-nav a{width:54px;height:46px;display:grid;place-items:center;color:var(--muted);text-decoration:none;border-radius:14px;font-size:18px}
.bottom-nav a.active{color:#fff;background:linear-gradient(90deg,rgba(56,151,240,.3),rgba(221,42,123,.3))}
@media(max-width:1150px){.layout{grid-template-columns:320px 1fr}.sidebar{display:none}}
@media(max-width:760px){
  .layout{grid-template-columns:1fr}.search{display:none}.bottom-nav{display:flex}
  .chat{display:none;height:calc(100vh - 130px)}.layout.chatting .chat{display:flex}.layout.chatting .list{display:none}
  .layout.chatting~.bottom-nav,body.chatting .bottom-nav{display:none}
  .back{display:grid}.m{max-width:85%}
}
@media(prefers-reduced-motion:reduce){.m,.typing i{animation:none}*{transition:none!important}}

.composer{position:relative}
.chat{animation:glow 5s ease-in-out infinite}
@keyframes glow{50%{box-shadow:0 0 90px rgba(221,42,123,.28),0 0 40px rgba(56,151,240,.18),inset 0 0 0 1px rgba(255,255,255,.08)}}
@keyframes spin{to{transform:rotate(360deg)}}
.stories{display:flex;gap:12px;overflow-x:auto;padding:2px 2px 12px}
.st{flex:0 0 auto;width:58px;text-align:center;font:600 11px Inter,sans-serif;color:var(--muted);cursor:pointer;background:none;border:0}
.ring{width:58px;height:58px;border-radius:50%;padding:3px;margin-bottom:5px;background:conic-gradient(var(--yellow),var(--orange),var(--pink),var(--purple),var(--blue),var(--yellow));animation:spin 6s linear infinite}
.ring .pa{width:100%;height:100%;border:3px solid #14141c;animation:spin 6s linear infinite reverse;color:#fff}
.st.me .ring{background:var(--panel-2);border:1px dashed var(--muted);animation:none}
.st.me .ring .pa{animation:none;background:none;font-size:22px;border:0}
.m{position:relative}.m.has{margin-bottom:12px}
.rc{color:rgba(255,255,255,.5)}.rc.seen{color:#4db3ff}
.rbar{position:absolute;top:-38px;display:none;gap:2px;padding:4px 8px;border-radius:999px;background:rgba(18,18,24,.92);border:1px solid var(--border);backdrop-filter:blur(14px);z-index:3}
.m.in .rbar{left:6px}.m.out .rbar{right:6px}
.m:hover .rbar,.m:focus-within .rbar{display:flex}
.rbar button{background:none;border:0;font-size:16px;cursor:pointer;padding:2px 4px;transition:.15s}.rbar button:hover{transform:scale(1.4)}
.rx{position:absolute;bottom:-13px;right:12px;background:rgba(20,20,28,.95);border:1px solid var(--border);border-radius:999px;padding:1px 7px;font-size:13px;animation:pop .3s}
.chips{display:flex;gap:8px;padding:10px 18px 0;overflow-x:auto}
.chips button{flex:0 0 auto;border:1px solid var(--border);background:rgba(255,255,255,.05);color:var(--text);border-radius:999px;padding:7px 13px;font:500 12px Inter,sans-serif;cursor:pointer;transition:.2s}
.chips button:hover{border-color:var(--pink);box-shadow:0 0 18px rgba(221,42,123,.35);transform:translateY(-1px)}
.emo{position:absolute;bottom:70px;left:18px;display:none;grid-template-columns:repeat(6,1fr);gap:4px;padding:10px;border-radius:18px;background:rgba(18,18,24,.94);backdrop-filter:blur(20px);border:1px solid var(--border);z-index:6;box-shadow:0 20px 50px rgba(0,0,0,.5)}
.emo.on{display:grid}
.emo button{background:none;border:0;font-size:22px;cursor:pointer;border-radius:10px;padding:5px;transition:.15s}.emo button:hover{background:rgba(255,255,255,.1);transform:scale(1.25)}
@media(prefers-reduced-motion:reduce){.ring,.ring .pa,.chat{animation:none}}
</style>
</head>
<body>
<canvas id="particles"></canvas>
<div class="app">
<header>
  <div class="logo">Meet</div>
  <div class="search"><input type="text" placeholder="Search people, rooms, and topics…" /></div>
  <div class="header-actions">
    <button class="icon-btn" title="Notifications">🔔</button>
    <a class="icon-btn" href="friends.html" title="Friends">👥</a>
    <a class="icon-btn" href="messages.html" title="Messages">💬</a>
    <div class="avatar" title="Your profile">Y</div>
  </div>
</header>
<div class="layout" id="layout">
  <aside class="panel sidebar">
    <nav class="nav">
      <a href="home.html">🏠 Home</a>
      <a href="#">🔍 Discover</a>
      <a href="messages.html" class="active">💬 Messages</a>
      <a href="friends.html">👥 Friends</a>
      <a href="#">🎥 Live Rooms</a>
      <a href="games.html">🎮 Games</a>
      <a href="#">❤️ Saved</a>
      <a href="#">⚙️ Settings</a>
    </nav>
  </aside>

  <section class="panel list">
    <div class="section-title"><h2>Messages</h2></div>
    <div class="stories" id="stories"></div>
    <input class="lsearch" id="ls" type="text" placeholder="Search chats…" aria-label="Search chats" />
    <div id="convs"></div>
  </section>

  <section class="panel chat" aria-label="Conversation">
    <div class="chead">
      <button class="icon-btn back" id="back" aria-label="Back to chats">←</button>
      <div class="pa" id="hav"></div>
      <div class="ci"><strong id="hn"></strong><p id="hs"></p></div>
    </div>
    <div class="msgs" id="msgs" aria-live="polite"></div>
    <div class="chips" id="chips"></div>
    <form class="composer" id="form" autocomplete="off">
      <div class="emo" id="emo"></div>
      <button class="icon-btn" type="button" id="eb" aria-label="Emoji">😊</button>
      <input id="inp" type="text" placeholder="Type a message…" aria-label="Message" />
      <button class="send" type="submit" aria-label="Send">➤</button>
    </form>
  </section>
</div>
</div>
<nav class="bottom-nav">
  <a href="home.html">🏠</a><a href="#">🔍</a><a href="messages.html" class="active">💬</a><a href="games.html">🎮</a>
</nav>

<script>
/* glowing particles */
const canvas=document.getElementById("particles"),ctx=canvas.getContext("2d");let particles=[],sparks=[];
const mouse={x:-999,y:-999};
addEventListener("pointermove",e=>{mouse.x=e.clientX;mouse.y=e.clientY});
addEventListener("pointerdown",e=>burst(e.clientX,e.clientY,8));
function burst(x,y,n=20,hues){
  for(let i=0;i<n&&sparks.length<700;i++){const a=Math.random()*6.283,sp=Math.random()*(n>60?9:4)+1;
    sparks.push({x,y,vx:Math.cos(a)*sp,vy:Math.sin(a)*sp-1,life:1,hue:hues?hues[Math.random()*hues.length|0]:Math.random()*360,r:Math.random()*2+1})}
}
const party=()=>burst(innerWidth/2,innerHeight/3,160);
function resize(){canvas.width=innerWidth;canvas.height=innerHeight;createParticles()}
function createParticles(){
  const count=Math.min(110,Math.floor(canvas.width*canvas.height/15000));
  particles=Array.from({length:count},()=>({x:Math.random()*canvas.width,y:Math.random()*canvas.height,r:Math.random()*1.8+.5,vx:(Math.random()-.5)*.25,vy:(Math.random()-.5)*.25,hue:Math.random()<.5?210:320,alpha:Math.random()*.4+.18}));
}
function animate(){
  ctx.clearRect(0,0,canvas.width,canvas.height);
  for(const p of particles){
    p.x+=p.vx;p.y+=p.vy;
    if(p.x<0||p.x>canvas.width)p.vx*=-1;if(p.y<0||p.y>canvas.height)p.vy*=-1;
    const dx=p.x-mouse.x,dy=p.y-mouse.y,md=Math.hypot(dx,dy);let boost=0;
    if(md<150){const f=(1-md/150);p.x+=dx/md*f*2.2;p.y+=dy/md*f*2.2;boost=f*.5}
    const g=ctx.createRadialGradient(p.x,p.y,0,p.x,p.y,p.r*7);
    g.addColorStop(0,`hsla(${p.hue},100%,70%,${Math.min(1,p.alpha+boost)})`);g.addColorStop(1,"transparent");
    ctx.fillStyle=g;ctx.beginPath();ctx.arc(p.x,p.y,p.r*7,0,Math.PI*2);ctx.fill();
    if(md<150){ctx.strokeStyle=`rgba(255,140,200,${(1-md/150)*.35})`;ctx.lineWidth=.8;ctx.beginPath();ctx.moveTo(p.x,p.y);ctx.lineTo(mouse.x,mouse.y);ctx.stroke()}
  }
  for(let i=0;i<particles.length;i++)for(let j=i+1;j<particles.length;j++){
    const a=particles[i],b=particles[j],d=Math.hypot(a.x-b.x,a.y-b.y);
    if(d<100){ctx.strokeStyle=`rgba(160,170,255,${(1-d/100)*.10})`;ctx.lineWidth=.6;ctx.beginPath();ctx.moveTo(a.x,a.y);ctx.lineTo(b.x,b.y);ctx.stroke()}
  }
  ctx.globalCompositeOperation='lighter';
  sparks=sparks.filter(k=>k.life>0);
  for(const k of sparks){
    k.x+=k.vx;k.y+=k.vy;k.vx*=.97;k.vy=k.vy*.97+.06;k.life-=.016;
    const g=ctx.createRadialGradient(k.x,k.y,0,k.x,k.y,k.r*6);
    g.addColorStop(0,`hsla(${k.hue},100%,65%,${k.life})`);g.addColorStop(1,"transparent");
    ctx.fillStyle=g;ctx.beginPath();ctx.arc(k.x,k.y,k.r*6,0,6.283);ctx.fill();
  }
  ctx.globalCompositeOperation='source-over';
  requestAnimationFrame(animate);
}
addEventListener("resize",resize);resize();animate();

/* chat */
const $=s=>document.querySelector(s);
const C=[
 {n:'Mia Chen',i:'M',k:'a',on:1,u:2,m:[['in','Hey! 👋 Are you joining the music room tonight?','18:02'],['out','Maybe! What time does it start?','18:05'],['in','Around 9. Bring your playlist 🎧','18:06']],r:['Haha nice, see you there!','Yes! I love that song 😍','Send me the link when you join','Perfect, it will be fun!']},
 {n:'Jordan Lee',i:'J',k:'b',on:1,u:0,m:[['in','Sent a game invite 🎮','17:40'],['out','Just saw it, give me 5 minutes','17:48']],r:['Cool, I will wait for you','Try the Snake game, my best is 22 🐍','Ready when you are 😎','Let’s play Tic-tac-toe next']},
 {n:'Sara Kim',i:'S',k:'c',on:0,u:1,m:[['in','That travel photo was amazing! 📸','Yesterday'],['out','Thanks! It was taken in Kigali 🇷🇼','Yesterday'],['in','I need to visit one day!','Yesterday']],r:['Tell me more about the trip','Wow, that sounds beautiful','Let’s plan something together ✈️','I will check it out soon']},
 {n:'David Patel',i:'D',k:'d',on:1,u:0,m:[['in','Did you hear the new album?','Mon'],['out','Not yet, is it good?','Mon']],r:['Really good, track 4 is my favourite','You should listen tonight 🎶','We can talk about it in the room','Haha agreed']}
];
let cur=0;
const esc=(t,e)=>{e.textContent=t;return e};
const now=()=>new Date().toLocaleTimeString([],{hour:'2-digit',minute:'2-digit'});
function renderList(){
  const q=$('#ls').value.toLowerCase(),box=$('#convs');box.innerHTML='';
  C.forEach((c,idx)=>{
    if(!c.n.toLowerCase().includes(q))return;
    const last=c.m[c.m.length-1];
    const d=document.createElement('div');d.className='conv'+(idx===cur?' on':'');d.tabIndex=0;d.setAttribute('role','button');
    d.innerHTML=`<div class="pa ${c.k}">${c.i}<span class="dot ${c.on?'':'off'}"></span></div><div class="ci"><strong><span></span><em></em></strong><p></p></div>${c.u?'<span class="badge"></span>':''}`;
    d.querySelector('strong span').textContent=c.n;d.querySelector('em').textContent=last[2];
    d.querySelector('p').textContent=(last[0]==='out'?'You: ':'')+last[1];
    if(c.u)d.querySelector('.badge').textContent=c.u;
    d.onclick=()=>openChat(idx);d.onkeydown=e=>{if(e.key==='Enter')openChat(idx)};
    box.appendChild(d);
  });
}
function bubble(t,who,time,seen=true){
  const m=document.createElement('div');m.className='m '+who;
  m.appendChild(document.createTextNode(t));
  const ti=document.createElement('time');ti.textContent=time;
  if(who==='out'){const r=document.createElement('span');r.className='rc'+(seen?' seen':'');r.textContent=seen?' ✓✓':' ✓';ti.appendChild(r)}
  m.appendChild(ti);
  const bar=document.createElement('div');bar.className='rbar';
  ['👍','❤️','😂','🔥'].forEach(e=>{const b=document.createElement('button');b.type='button';b.textContent=e;b.setAttribute('aria-label','React '+e);b.onclick=ev=>{ev.stopPropagation();react(m,e)};bar.appendChild(b)});
  m.appendChild(bar);m.ondblclick=()=>react(m,'❤️');
  $('#msgs').appendChild(m);$('#msgs').scrollTop=1e6;return m;
}
function react(m,e){
  let x=m.querySelector('.rx');
  if(x&&x.textContent===e){x.remove();m.classList.remove('has');return}
  if(!x){x=document.createElement('span');x.className='rx';m.appendChild(x)}
  x.textContent=e;m.classList.add('has');
  const r=m.getBoundingClientRect();burst(r.right-20,r.bottom,22,[330,30,50]);
}
const markSeen=()=>document.querySelectorAll('#msgs .rc').forEach(r=>{r.classList.add('seen');r.textContent=' ✓✓'});
function openChat(i){
  cur=i;const c=C[i];c.u=0;
  $('#hav').className='pa '+c.k;$('#hav').innerHTML=c.i+`<span class="dot ${c.on?'':'off'}"></span>`;
  $('#hn').textContent=c.n;$('#hs').textContent=c.on?'Online now':'Offline';$('#hs').className=c.on?'':'off';
  $('#msgs').innerHTML='<div class="day">Today</div>';
  c.m.forEach(([w,t,ti])=>bubble(t,w,ti));
  $('#layout').classList.add('chatting');document.body.classList.add('chatting');
  renderList();
}
$('#back').onclick=()=>{$('#layout').classList.remove('chatting');document.body.classList.remove('chatting')};
$('#ls').oninput=renderList;
function send(t){
  const idx=cur,c=C[idx],ti=now();c.m.push(['out',t,ti]);bubble(t,'out',ti,false);renderList();
  const sb=$('.send').getBoundingClientRect();burst(sb.left+23,sb.top+23,16,[210,320]);
  if(/🎉|\/party/.test(t))party();
  if(!c.on)return;
  const ty=document.createElement('div');ty.className='typing';ty.innerHTML='<i></i><i></i><i></i>';
  setTimeout(()=>{if(cur===idx)markSeen()},900);
  setTimeout(()=>{if(cur===idx){$('#msgs').appendChild(ty);$('#msgs').scrollTop=1e6}},1100);
  setTimeout(()=>{
    ty.remove();const r=c.r[Math.random()*c.r.length|0],t2=now();c.m.push(['in',r,t2]);
    if(cur===idx)bubble(r,'in',t2);else c.u++;renderList();
  },2200+Math.random()*1200);
}
$('#form').onsubmit=e=>{e.preventDefault();const t=$('#inp').value.trim();if(!t)return;$('#inp').value='';$('#emo').classList.remove('on');send(t)};
openChat(0);
$('#layout').classList.remove('chatting');document.body.classList.remove('chatting');

/* stories, quick replies, emoji */
const stories=$('#stories');
const me=document.createElement('button');me.className='st me';me.innerHTML='<div class="ring"><div class="pa">+</div></div>Your story';stories.appendChild(me);
C.forEach((c,i)=>{const b=document.createElement('button');b.className='st';b.innerHTML=`<div class="ring"><div class="pa ${c.k}">${c.i}</div></div><span></span>`;b.querySelector('span').textContent=c.n.split(' ')[0];b.onclick=()=>openChat(i);stories.appendChild(b)});
['😂','🔥 Love it!','Tell me more 👀','On my way 🚀','🎉 Party time!'].forEach(t=>{const b=document.createElement('button');b.type='button';b.textContent=t;b.onclick=()=>send(t);$('#chips').appendChild(b)});
['😀','😂','😍','🥳','😎','🤔','👍','👏','🙏','❤️','🔥','✨','🎉','🎧','🎮','📸','✈️','🌍','🍕','☕','🚀','💡','😴','😭'].forEach(e=>{const b=document.createElement('button');b.type='button';b.textContent=e;b.onclick=()=>{$('#inp').value+=e;$('#inp').focus()};$('#emo').appendChild(b)});
$('#eb').onclick=()=>$('#emo').classList.toggle('on');
</script>
</body>
