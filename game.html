<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Games</title>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);color-scheme:dark;
--text:#f5f5f7;--muted:#a4a8b8;--panel:rgba(14,18,32,.72);--raise:rgba(255,255,255,.1);--line:rgba(255,255,255,.16);--accent:#8ec8ff;--btn:#0095f6;--ink:#fff;--pink:#d62976;--violet:#962fbf}
:root[data-theme=light]{color-scheme:light;--text:#10163a;--muted:#5a6083;--panel:rgba(255,255,255,.7);--raise:rgba(255,255,255,.6);--line:rgba(16,22,58,.18);--accent:#3a5bd9;--btn:#3a5bd9}
*,*::before,*::after{box-sizing:inherit}
html{height:100%}
body{margin:0;min-height:100%;color:var(--text);font:15px/1.45 "Outfit",system-ui,sans-serif;background:radial-gradient(900px 600px at 12% 8%,#2a1646 0,transparent 62%),radial-gradient(800px 560px at 92% 95%,#1b3a66 0,transparent 60%),#07101c;background-attachment:fixed}
:root[data-theme=light] body{background:linear-gradient(135deg,#c9d7ff,#ffd6f3);background-attachment:fixed}
button{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.wrap{max-width:980px;margin:0 auto;padding:22px 16px 40px}
.top{display:flex;align-items:center;gap:10px;margin-bottom:18px}
.pane{background:var(--panel);border:1px solid var(--line);border-radius:22px;-webkit-backdrop-filter:blur(18px) saturate(160%);backdrop-filter:blur(18px) saturate(160%);box-shadow:0 24px 50px rgba(0,0,0,.3),inset 0 1px 0 rgba(255,255,255,.25)}
.btn{background:var(--btn);color:#fff;border:0;border-radius:14px;padding:10px 18px;font-weight:600;cursor:pointer;box-shadow:0 0 18px rgba(0,149,246,.4)}
.ghost{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:9px 14px;cursor:pointer;text-decoration:none;display:inline-block}
.sp{margin-left:auto}
h1{font:400 clamp(40px,8vw,64px)/1.1 "Grand Hotel","Brush Script MT",cursive;margin:0 0 4px;background:linear-gradient(45deg,#feda75,#fa7e1e 25%,#d62976 52%,#962fbf 76%,#4f5bd5);-webkit-background-clip:text;background-clip:text;color:transparent}
h2{font-weight:500;font-size:22px;margin:0 0 6px}
.muted{color:var(--muted)}
.hub{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:16px;margin-top:22px;perspective:1000px}
.tile{padding:22px;text-align:left;cursor:pointer;border:1px solid var(--line);transition:transform .15s ease-out,border-color .2s;transform-style:preserve-3d}
.tile:hover{border-color:var(--accent)}
.tile .ic{font-size:38px;display:block;transform:translateZ(40px)}
.tile h2{margin-top:10px;transform:translateZ(24px)}
.best{font-size:13px;color:var(--accent)}
#stage{display:none}
#stage.on{display:block}
#hub.off{display:none}
.game{padding:22px;text-align:center}
.bar{display:flex;gap:12px;align-items:center;justify-content:center;flex-wrap:wrap;margin:12px 0}
.stat{padding:6px 14px;border-radius:999px;background:var(--raise);border:1px solid var(--line)}
.msg{min-height:26px;font-weight:500;color:var(--accent)}
/* memory */
.mem{display:grid;grid-template-columns:repeat(4,minmax(0,78px));gap:10px;justify-content:center;margin:16px 0;perspective:800px}
.card{aspect-ratio:1;border:0;background:none;padding:0;cursor:pointer;position:relative;transform-style:preserve-3d;transition:transform .45s}
.card.flip{transform:rotateY(180deg)}
.card span{position:absolute;inset:0;display:grid;place-items:center;border-radius:16px;border:1px solid var(--line);backface-visibility:hidden;-webkit-backface-visibility:hidden;font-size:34px}
.card .f{background:var(--raise)}
.card .b{background:linear-gradient(135deg,var(--violet),var(--btn));transform:rotateY(180deg)}
.card.done .b{box-shadow:0 0 18px rgba(94,240,255,.6)}
/* ttt */
.ttt{display:grid;grid-template-columns:repeat(3,84px);gap:10px;justify-content:center;margin:16px 0}
.cell{height:84px;font-size:38px;font-weight:600;border-radius:16px;border:1px solid var(--line);background:var(--raise);cursor:pointer}
.cell:hover{border-color:var(--accent)}
/* snake */
canvas{max-width:100%;border-radius:18px;border:1px solid var(--line);background:rgba(0,0,0,.35);touch-action:none}
.pad{display:grid;grid-template-columns:repeat(3,56px);gap:8px;justify-content:center;margin-top:12px}
.pad button{height:48px;border-radius:14px;border:1px solid var(--line);background:var(--raise);cursor:pointer;font-size:20px}
.pad .u{grid-column:2}.pad .l{grid-column:1;grid-row:2}.pad .d{grid-column:2;grid-row:2}.pad .r{grid-column:3;grid-row:2}
input[type=number]{padding:12px 14px;border-radius:14px;border:1px solid var(--line);background:var(--panel);color:var(--text);width:140px;font:inherit}
@media(prefers-reduced-motion:reduce){.tile,.card{transition:none}}
</style>
</head>
<body>
<div class="wrap">
  <div class="top">
    <a class="ghost" href="meet.html">‹ Home</a>
    <button class="ghost sp" id="theme">Light</button>
  </div>

  <div id="hub">
    <h1>Game Room</h1>
    <p class="muted" style="margin:0">Pick a game and beat your best score.</p>
    <div class="hub">
      <button class="pane tile" data-g="memory"><span class="ic">🧠</span><h2>Memory Match</h2><span class="muted">Find all the pairs.</span><div class="best" id="b-memory"></div></button>
      <button class="pane tile" data-g="snake"><span class="ic">🐍</span><h2>Snake</h2><span class="muted">Eat, grow, don't crash.</span><div class="best" id="b-snake"></div></button>
      <button class="pane tile" data-g="ttt"><span class="ic">❌</span><h2>Tic-Tac-Toe</h2><span class="muted">Try to beat the computer.</span><div class="best" id="b-ttt"></div></button>
      <button class="pane tile" data-g="guess"><span class="ic">🔢</span><h2>Guess the Number</h2><span class="muted">Pick from 1 to 100.</span><div class="best" id="b-guess"></div></button>
    </div>
  </div>

  <div id="stage">
    <div class="row"><button class="ghost" id="back">‹ All games</button></div>
    <div class="pane game" id="game" style="margin-top:14px"></div>
  </div>
</div>

<script>
var $=function(i){return document.getElementById(i)};
function ls(k,v){try{if(v===undefined)return localStorage.getItem(k);localStorage.setItem(k,v)}catch(e){}return null}
var timer=null,keyFn=null;

/* best scores */
function best(g){return ls("gbest_"+g)}
function setBest(g,v,low){var o=best(g);if(o===null||(low?v<+o:v>+o)){ls("gbest_"+g,v);showBest();return true}return false}
function showBest(){
  var m=best("memory"),s=best("snake"),t=ls("gwins_ttt"),g=best("guess");
  $("b-memory").textContent=m?"Best: "+m+" moves":"";
  $("b-snake").textContent=s?"Best: "+s+" points":"";
  $("b-ttt").textContent=t?"Wins: "+t:"";
  $("b-guess").textContent=g?"Best: "+g+" tries":"";
}

/* navigation */
function stop(){clearInterval(timer);timer=null;if(keyFn){document.removeEventListener("keydown",keyFn);keyFn=null}}
function open(g){
  stop();$("hub").classList.add("off");$("stage").classList.add("on");
  ({memory:memory,snake:snake,ttt:ttt,guess:guess})[g]();
}
$("back").addEventListener("click",function(){stop();$("stage").classList.remove("on");$("hub").classList.remove("off");showBest()});
document.querySelectorAll(".tile").forEach(function(t){
  t.addEventListener("click",function(){open(t.dataset.g)});
  t.addEventListener("pointermove",function(e){
    if(matchMedia("(prefers-reduced-motion: reduce)").matches)return;
    var r=t.getBoundingClientRect();
    t.style.transform="rotateY("+((e.clientX-r.left)/r.width-.5)*16+"deg) rotateX("+(-((e.clientY-r.top)/r.height-.5))*16+"deg)";
  });
  t.addEventListener("pointerleave",function(){t.style.transform=""});
});
$("theme").addEventListener("click",function(){
  var r=document.documentElement,l=r.dataset.theme==="light";
  r.dataset.theme=l?"dark":"light";$("theme").textContent=l?"Light":"Dark";
});

/* MEMORY */
function memory(){
  var em=["🚀","🎧","🌈","🍉","⚡","🎲","🪐","🦋"],deck=em.concat(em).sort(function(){return Math.random()-.5}),
      open1=null,lock=false,moves=0,found=0;
  $("game").innerHTML='<h2>Memory Match</h2><div class="bar"><span class="stat">Moves: <b id="mv">0</b></span><button class="ghost" id="again">New game</button></div><div class="mem" id="mem"></div><div class="msg" id="mm" role="status"></div>';
  $("mem").innerHTML=deck.map(function(e,i){return '<button class="card" data-i="'+i+'" aria-label="Card '+(i+1)+'"><span class="f">?</span><span class="b">'+e+'</span></button>'}).join("");
  $("again").onclick=memory;
  $("mem").onclick=function(ev){
    var c=ev.target.closest(".card");
    if(!c||lock||c.classList.contains("flip"))return;
    c.classList.add("flip");
    if(!open1){open1=c;return}
    moves++;$("mv").textContent=moves;
    var a=open1,b=c;open1=null;
    if(deck[a.dataset.i]===deck[b.dataset.i]){
      a.classList.add("done");b.classList.add("done");found++;
      if(found===8){var n=setBest("memory",moves,true);$("mm").textContent="You won in "+moves+" moves!"+(n?" New best 🎉":"")}
    }else{
      lock=true;
      setTimeout(function(){a.classList.remove("flip");b.classList.remove("flip");lock=false},800);
    }
  };
}

/* SNAKE */
function snake(){
  $("game").innerHTML='<h2>Snake</h2><div class="bar"><span class="stat">Score: <b id="sc">0</b></span><button class="ghost" id="again">New game</button></div><canvas id="cv" width="360" height="360" aria-label="Snake board"></canvas><div class="pad" id="pad"><button class="u" data-d="u" aria-label="Up">▲</button><button class="l" data-d="l" aria-label="Left">◀</button><button class="d" data-d="d" aria-label="Down">▼</button><button class="r" data-d="r" aria-label="Right">▶</button></div><div class="msg" id="sm" role="status">Use arrow keys, swipe or the buttons.</div>';
  var cv=$("cv"),x=cv.getContext("2d"),N=18,S=20,sn,dir,nd,food,score,dead;
  var V={u:[0,-1],d:[0,1],l:[-1,0],r:[1,0]};
  function put(){do{food=[Math.floor(Math.random()*N),Math.floor(Math.random()*N)]}while(sn.some(function(p){return p[0]===food[0]&&p[1]===food[1]}))}
  function reset(){stop();sn=[[9,9],[8,9],[7,9]];dir=nd="r";score=0;dead=false;$("sc").textContent=0;$("sm").textContent="Use arrow keys, swipe or the buttons.";put();draw();timer=setInterval(tick,125);keyFn=key;document.addEventListener("keydown",key)}
  function turn(d){var o={u:"d",d:"u",l:"r",r:"l"};if(o[d]!==dir)nd=d}
  function key(e){var m={ArrowUp:"u",ArrowDown:"d",ArrowLeft:"l",ArrowRight:"r"}[e.key];if(m){e.preventDefault();turn(m)}}
  function tick(){
    dir=nd;var h=[sn[0][0]+V[dir][0],sn[0][1]+V[dir][1]];
    if(h[0]<0||h[1]<0||h[0]>=N||h[1]>=N||sn.some(function(p){return p[0]===h[0]&&p[1]===h[1]})){
      dead=true;stop();var n=setBest("snake",score);$("sm").textContent="Game over. Score "+score+"."+(n&&score>0?" New best 🎉":"");return}
    sn.unshift(h);
    if(h[0]===food[0]&&h[1]===food[1]){score++;$("sc").textContent=score;put()}else sn.pop();
    draw();
  }
  function draw(){
    x.clearRect(0,0,360,360);
    x.shadowBlur=14;x.shadowColor="#ff6bd6";x.fillStyle="#ff6bd6";x.beginPath();x.arc(food[0]*S+10,food[1]*S+10,7,0,6.283);x.fill();
    sn.forEach(function(p,i){x.shadowColor="#5ef0ff";x.fillStyle=i?"#8ec8ff":"#5ef0ff";x.beginPath();x.roundRect?x.roundRect(p[0]*S+1,p[1]*S+1,S-2,S-2,6):x.rect(p[0]*S+1,p[1]*S+1,S-2,S-2);x.fill()});
  }
  $("again").onclick=reset;
  $("pad").onclick=function(e){var b=e.target.closest("button");if(b)turn(b.dataset.d)};
  var sx,sy;
  cv.addEventListener("pointerdown",function(e){sx=e.clientX;sy=e.clientY});
  cv.addEventListener("pointerup",function(e){
    var dx=e.clientX-sx,dy=e.clientY-sy;if(Math.max(Math.abs(dx),Math.abs(dy))<20)return;
    turn(Math.abs(dx)>Math.abs(dy)?(dx>0?"r":"l"):(dy>0?"d":"u"));
  });
  reset();
}

/* TIC-TAC-TOE (computer plays perfectly) */
function ttt(){
  var b,over,L=[[0,1,2],[3,4,5],[6,7,8],[0,3,6],[1,4,7],[2,5,8],[0,4,8],[2,4,6]];
  function win(a,p){return L.some(function(l){return l.every(function(i){return a[i]===p})})}
  function mm(a,p){
    if(win(a,"O"))return 1;if(win(a,"X"))return -1;if(a.every(Boolean))return 0;
    var bs=p==="O"?-2:2;
    for(var i=0;i<9;i++)if(!a[i]){a[i]=p;var s=mm(a,p==="O"?"X":"O");a[i]="";bs=p==="O"?Math.max(bs,s):Math.min(bs,s)}
    return bs;
  }
  function cpu(){var m=-1,bs=-2;for(var i=0;i<9;i++)if(!b[i]){b[i]="O";var s=mm(b,"X");b[i]="";if(s>bs){bs=s;m=i}}b[m]="O"}
  function draw(msg){$("tb").innerHTML=b.map(function(v,i){return '<button class="cell" data-i="'+i+'" aria-label="Square '+(i+1)+'">'+v+'</button>'}).join("");$("tm").textContent=msg}
  function reset(){b=["","","","","","","","",""];over=false;draw("Your turn. You are X.")}
  $("game").innerHTML='<h2>Tic-Tac-Toe</h2><div class="bar"><button class="ghost" id="again">New game</button></div><div class="ttt" id="tb"></div><div class="msg" id="tm" role="status"></div>';
  $("again").onclick=reset;
  $("tb").onclick=function(e){
    var c=e.target.closest(".cell");if(!c||over)return;var i=+c.dataset.i;if(b[i])return;
    b[i]="X";
    if(win(b,"X")){over=true;ls("gwins_ttt",(+ls("gwins_ttt")||0)+1);draw("You win! 🎉");return}
    if(b.every(Boolean)){over=true;draw("It's a draw.");return}
    cpu();
    if(win(b,"O")){over=true;draw("Computer wins. Try again.");return}
    if(b.every(Boolean)){over=true;draw("It's a draw.");return}
    draw("Your turn. You are X.");
  };
  reset();
}

/* GUESS THE NUMBER */
function guess(){
  var secret=1+Math.floor(Math.random()*100),tries=0,done=false;
  $("game").innerHTML='<h2>Guess the Number</h2><p class="muted" style="margin:0">I am thinking of a number from 1 to 100.</p><div class="bar"><input id="gn" type="number" min="1" max="100" placeholder="Your guess" aria-label="Your guess"><button class="btn" id="gb">Guess</button></div><div class="bar"><span class="stat">Tries: <b id="gt">0</b></span><button class="ghost" id="again">New game</button></div><div class="msg" id="gm" role="status"></div>';
  function go(){
    if(done)return;var g=parseInt($("gn").value,10);
    if(!g||g<1||g>100){$("gm").textContent="Enter a number from 1 to 100.";return}
    tries++;$("gt").textContent=tries;$("gn").value="";
    if(g===secret){done=true;var n=setBest("guess",tries,true);$("gm").textContent="Correct! "+tries+" tries."+(n?" New best 🎉":"")}
    else $("gm").textContent=g<secret?"Too low. Try higher.":"Too high. Try lower.";
  }
  $("gb").onclick=go;$("gn").onkeydown=function(e){if(e.key==="Enter")go()};
  $("again").onclick=guess;$("gn").focus();
}
showBest();
</script>
</body>
</html>
