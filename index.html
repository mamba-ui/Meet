<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Meet – Log in</title>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
:root{--text:#eaf6ff;--muted:#a3bdd1;--ice:#9fe8ff;--ice2:#b9a8ff;--glass:rgba(200,235,255,.09);--edge:rgba(220,245,255,.28);--ink:#06202e;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);color-scheme:dark}
html{height:100%}*,*::before,*::after{box-sizing:inherit}
body{margin:0;min-height:100%;display:grid;place-items:center;padding:16px;color:var(--text);font:15px/1.45 "Outfit",system-ui,sans-serif;background:radial-gradient(900px 600px at 15% 10%,#1d4f78 0,transparent 60%),radial-gradient(800px 600px at 90% 90%,#47348f 0,transparent 60%),#07121f}
form{width:100%;max-width:380px;padding:30px 26px;border-radius:24px;background:var(--glass);border:1px solid var(--edge);-webkit-backdrop-filter:blur(22px);backdrop-filter:blur(22px);box-shadow:inset 0 1px 0 rgba(255,255,255,.28),0 10px 40px rgba(2,10,30,.45)}
h1{font-weight:500;font-size:26px;margin:0 0 4px}
p{margin:0 0 20px;color:var(--muted)}
label{display:block;font-size:13px;color:var(--muted);margin:12px 0 6px}
input{width:100%;padding:12px 14px;border-radius:14px;border:1px solid var(--edge);background:var(--glass);color:var(--text);font:inherit}
button{width:100%;margin-top:22px;padding:13px;border:0;border-radius:14px;background:linear-gradient(135deg,var(--ice),var(--ice2));color:var(--ink);font:inherit;font-weight:600;cursor:pointer;box-shadow:0 0 18px rgba(159,232,255,.45)}
.err{color:#ffb4b4;font-size:13px;min-height:18px;margin-top:10px}
:focus-visible{outline:2px solid var(--ice);outline-offset:2px}
</style>
</head>
<body>
<form id="f">
  <h1>Log in to Meet</h1>
  <p>Enter your details to continue.</p>
  <label for="u">Name or email</label>
  <input id="u" autocomplete="username">
  <label for="p">Password</label>
  <input id="p" type="password" autocomplete="current-password">
  <div class="err" id="e" role="alert"></div>
  <button type="submit">Log in</button>
</form>
<script>
try{if(localStorage.getItem("meetUser"))location.replace("home.html")}catch(e){}
document.getElementById("f").addEventListener("submit",function(ev){
  ev.preventDefault();
  var u=document.getElementById("u").value.trim(),p=document.getElementById("p").value;
  if(!u||!p){document.getElementById("e").textContent="Enter your name and password.";return}
  /* Demo login: replace this with your real sign-in check. */
  try{localStorage.setItem("meetUser",u)}catch(e){}
  location.href="home.html";
});
</script>
</body>
</html>
