<script>
  if(localStorage.getItem("meetUser")){
    location.replace("home.html");
  }

  document.getElementById("f").addEventListener("submit", function(event){
    event.preventDefault();

    const name = document.getElementById("u").value.trim();
    const password = document.getElementById("p").value;

    if(!name || !password){
      document.getElementById("e").textContent = "Enter your name and password.";
      return;
    }

    localStorage.setItem("meetUser", name);
    location.href = "home.html";
  });

  document.getElementById("guest").addEventListener("click", function(){
    localStorage.setItem("meetUser", "Guest");
    location.href = "home.html";
  });
</script>
